services:
  db:
    image: postgres:15-alpine
    container_name: top_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tactical_user
      POSTGRES_PASSWORD: tactical_pass
      POSTGRES_DB: tactical_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tactical_user -d tactical_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: top_backend
    restart: unless-stopped
    environment:
      SECRET_KEY: tactical_c4isr_production_secret_key_2026
      DATABASE_URL: postgresql://tactical_user:tactical_pass@db:5432/tactical_db
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:80,http://127.0.0.1:5173
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/yolov8n.pt:/app/yolov8n.pt

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: top_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
